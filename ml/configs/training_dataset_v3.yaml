version: training_v3
approval_status: implementation_authorized

inputs:
  features_root: ml/data/processed/features_v3
  labels_root: ml/data/processed/labels_v3_1
  split_config: ml/configs/splits/xauusd_m5_split_v3.yaml

outputs:
  dataset_root: ml/data/datasets/training_v3
  report_root: ml/data/reports

targets:
  binary:
    - long_net_profitable
    - short_net_profitable
  optional_regression_metadata:
    - long_net_r_base
    - short_net_r_base
  success_rule: directional_net_realised_r_strictly_greater_than_zero

eligibility:
  require_feature_eligible: true
  require_label_supervised_eligible: true
  retain_ineligible_assignments: true

protection:
  purge_by_directional_exit_timestamp: true
  embargo_minutes: 240
  untouched_test_locked: true

partitioning: [split, decision_year]
compression: zstd
random_seed: 42
