version: outcome_v1

input:
  candidates_root: ml/data/processed/candidates
  candidate_manifest_path: ml/data/processed/candidates/candidate_manifest.json
  candles_root: ml/data/processed/cleaned_candles
  candle_manifest_path: ml/data/processed/cleaned_candles/dataset_manifest.json

output:
  outcomes_root: ml/data/processed/outcomes
  reports_root: ml/data/reports

entry:
  policy: market_on_candidate_close
  price_field: entry_price

position:
  take_profit_fractions:
    - 0.3333333333333333
    - 0.3333333333333333
    - 0.3333333333333334
  stop_policy: fixed_initial_stop

expiry_days:
  M5: 1
  M15: 2
  H1: 14

same_candle_resolution:
  lower_timeframes:
    M5: M1
    M15: M5
    H1: M15
  require_complete_lower_candle_coverage: true
  unresolved_policy: stop_first_conservative

execution_cost:
  estimated_round_trip_cost_r: 0.05

fail_on_invalid_outcome: true
fail_on_duplicate_candidate_id: true
partition_columns:
  - strategy_name
  - timeframe
  - outcome_class
  - year
compression: zstd

