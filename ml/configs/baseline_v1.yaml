version: baseline_v1
model_family: baseline
training_dataset_root: ml/data/datasets/training_v1
training_manifest_path: ml/data/datasets/training_v1/training_manifest.json
artifacts_root: artifacts/experiments
random_seed: 42
tasks: [binary, multiclass, regression]
baseline:
  classifier_strategy: prior
  regressor_strategy: median
evaluation:
  calibration_bins: 10
  score_buckets: 10
  shap_sample_rows: 0
  walk_forward: true
smoke:
  train_rows: 300
  validation_rows: 150
  test_rows: 150
  walk_train_rows: 300
  walk_validation_rows: 150
