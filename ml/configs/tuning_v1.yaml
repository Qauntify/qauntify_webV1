version: tuning_v1
base_config: ml/configs/catboost_v1.yaml
training_dataset_root: ml/data/datasets/training_v1
artifacts_root: artifacts/tuning
random_seed: 42
tasks: [binary, multiclass, regression]

# Deliberately small, reviewable search. Add trials only by creating a new
# policy version; never edit a completed tuning_v1 experiment in place.
trials:
  - {name: conservative_d6, iterations: 800, depth: 6, learning_rate: 0.03, l2_leaf_reg: 7.0}
  - {name: balanced_d7, iterations: 1000, depth: 7, learning_rate: 0.04, l2_leaf_reg: 5.0}
  - {name: faster_d7, iterations: 800, depth: 7, learning_rate: 0.05, l2_leaf_reg: 7.0}
  - {name: expressive_d8, iterations: 1200, depth: 8, learning_rate: 0.03, l2_leaf_reg: 7.0}
  - {name: regularized_d8, iterations: 1000, depth: 8, learning_rate: 0.035, l2_leaf_reg: 10.0}

selection:
  primary_metrics: {binary: roc_auc, multiclass: macro_f1, regression: rmse}
  metric_directions: {binary: 1, multiclass: 1, regression: -1}
  fold_std_penalty: 0.50
  overfit_penalty: 0.25
  temporal_slope_penalty: 0.50

tuning_folds:
  folds: 5
  initial_train_fraction: 0.50
  validation_fraction: 0.10
  embargo_days: 14
  expanding_window: true
  purge_label_windows: true
  source_splits: [train, validation]
  excluded_splits: [test, embargo]

binary_thresholds:
  values: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80]
  minimum_coverage: 0.05
  fold_std_penalty: 0.50

smoke:
  train_rows: 300
  validation_rows: 150
  test_rows: 150
  walk_train_rows: 300
  walk_validation_rows: 150
  iterations: 10
  trial_limit: 1
