version: catboost_v1
model_family: catboost
training_dataset_root: ml/data/datasets/training_v1
training_manifest_path: ml/data/datasets/training_v1/training_manifest.json
artifacts_root: artifacts/experiments
random_seed: 42
tasks: [binary, multiclass, regression]
catboost:
  iterations: 1000
  depth: 7
  learning_rate: 0.04
  l2_leaf_reg: 5.0
  loss_binary: Logloss
  loss_multiclass: MultiClass
  loss_regression: RMSE
  eval_binary: AUC
  eval_multiclass: MultiClass
  eval_regression: RMSE
  early_stopping_rounds: 100
  thread_count: -1
  task_type: CPU
  verbose: 50
  snapshot_interval_seconds: 60
evaluation:
  calibration_bins: 10
  score_buckets: 10
  shap_sample_rows: 1000
  walk_forward: true
smoke:
  train_rows: 300
  validation_rows: 150
  test_rows: 150
  walk_train_rows: 300
  walk_validation_rows: 150
  iterations: 10
