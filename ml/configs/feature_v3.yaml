version: feature_v3
label_version: label_v3_1
decision_timeframe: M5
context_timeframe: M15
source_timestamp_meaning: candle_open
session_features_enabled: false

alignment:
  decision_time: m5_open_plus_5_minutes
  m15_available_time: m15_open_plus_15_minutes
  join: backward_asof_available_time_lte_decision_time
  forward_fill_across_material_gap: false

warmup:
  require_all_features_finite: true
  minimum_m5_history_bars: 200
  minimum_m15_history_bars: 200

trend:
  ema_periods: [9, 20, 21, 50, 100, 200]
  sma_periods: [10, 20, 50, 100, 200]
  slope_lag_bars: 3
  normalize_distances_by: atr_14

momentum:
  rsi_periods: [7, 14, 21]
  rsi_change_lags: [1, 3]
  macd: {fast: 12, slow: 26, signal: 9}
  roc_periods: [3, 6, 12]

volatility:
  atr_periods: [7, 14, 21]
  bollinger: {period: 20, standard_deviations: 2.0, ddof: 0}
  realised_volatility_periods: [12, 48]

trend_strength:
  adx_period: 14
  include_plus_di: true
  include_minus_di: true

candles:
  return_periods: [1, 3, 6, 12]
  range_normalizer: atr_14
  zero_range_value: 0.0

m15_context:
  ema_periods: [20, 50, 200]
  rsi_periods: [14]
  atr_periods: [14]
  adx_period: 14
  bollinger: {period: 20, standard_deviations: 2.0, ddof: 0}

excluded:
  - session
  - hour
  - weekday
  - month
  - volume_derived_features
  - news
  - future_outcomes

