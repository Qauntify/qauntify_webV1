version: classifiers_v3
dataset_root: ml/data/datasets/training_v3
artifacts_root: artifacts/experiments
random_seed: 42
directions: [long, short]
models: [prevalence, logistic_regression, shallow_tree, random_forest, catboost]
baseline:
  shallow_tree_max_depth: 4
  random_forest_trees: 200
  random_forest_max_depth: 8
  logistic_max_iterations: 1000
catboost:
  iterations: 1000
  depth: 7
  learning_rate: 0.04
  l2_leaf_reg: 5.0
  early_stopping_rounds: 100
  thread_count: -1
smoke:
  train_rows: 1000
  validation_rows: 500
  catboost_iterations: 10
evaluation:
  use_primary_validation: true
  use_all_five_walk_forward_folds: true
  untouched_test_access: forbidden
