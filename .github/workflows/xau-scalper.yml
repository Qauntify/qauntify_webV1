name: XAUUSD 1m scalper

# Scans XAUUSD on 1m every ~60s using ict_fvg, confirmed with the spare
# SEA-LION keys (KEY5-7). Only KEY5-7 are passed in, so the scalper never
# touches the main engine's KEY1-4. One job runs a ~58-minute loop.
# Scheduled by cron-job.org → /api/cron/trigger-xau-scalper (hourly restart;
# gold is closed weekends, so gaps then don't matter). Free — public repo.

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [run-xau-scalper]

concurrency:
  group: xau-scalper
  cancel-in-progress: true

jobs:
  scalp:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan XAUUSD 1m every 60s
        env:
          SEALION_API_KEY5: ${{ secrets.SEALION_API_KEY5 }}
          SEALION_API_KEY6: ${{ secrets.SEALION_API_KEY6 }}
          SEALION_API_KEY7: ${{ secrets.SEALION_API_KEY7 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # LLM confirmation-gate A/B, same experiment as the main engine
          # (signals-engine.yml) — see docs/superpowers/specs/2026-07-26-ai-gate-ab-design.md.
          # This workflow was missed when the experiment was switched on: 96%
          # of genuine LLM-verdict rejects happen on this 1m scan, so without
          # this the shadow arm never accumulates (confirmed via ai_events —
          # 53 of 55 genuine rejects over 14 days were on 1m, 0 sampled).
          SHADOW_SAMPLE_RATE: "0.25"
        run: |
          for i in $(seq 1 58); do
            echo "--- scan $i/58 ---"
            python -m signals.xau_scan || true
            sleep 60
          done
      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERTS_CHAT_ID: ${{ secrets.TELEGRAM_ALERTS_CHAT_ID }}
          CRON_JOB_NAME: xau-scalper
          CRON_FAIL_DETAIL: XAU scalper job failed — open the run log for the failing step
        run: bash scripts/notify_cron_failure.sh
